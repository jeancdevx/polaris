name: Terraform apply production (manual)

on:
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    uses: ./.github/workflows/iac-apply.yml
    with:
      environment: prod
      terraform_directory: iac/environments/prod
      var_file: prod.ci.tfvars
      state_key: env/prod/terraform.tfstate
    secrets: inherit
