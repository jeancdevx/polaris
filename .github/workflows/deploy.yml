name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment y sufijo de recursos AWS (dev, prod)
        required: true
        type: string
      force_all:
        description: Redesplegar todos los servicios aunque no tengan cambios
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_NAME: polaris
  ALL_SERVICES:
    '["api-service", "reservation-service", "event-processor-service",
    "admin-service"]'

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.services.outputs.list }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter service paths
        id: filter
        if: ${{ !inputs.force_all }}
        uses: dorny/paths-filter@v4
        with:
          filters: .github/filters/services.yml

      - name: Build service matrix
        id: services
        env:
          FORCE_ALL: ${{ inputs.force_all }}
          CHANGES: ${{ steps.filter.outputs.changes || '[]' }}
        run: |
          if [ "$FORCE_ALL" = "true" ]; then
            list=$ALL_SERVICES
          else
            list=$(echo "$CHANGES" | jq -c '[.[] | select(. == ("api-service", "reservation-service", "event-processor-service", "admin-service"))]')
          fi
          echo "list=$(echo "$list" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "Services to deploy: $list"

  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.services != '[]'
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      NAME_PREFIX: polaris-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.NAME_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.NAME_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${NAME_PREFIX}-cluster" \
            --service "${NAME_PREFIX}-${{ matrix.service }}" \
            --force-new-deployment \
            --query 'service.{service: serviceName, taskDef: taskDefinition, desired: desiredCount}' \
            --output table

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster "${NAME_PREFIX}-cluster" \
            --services "${NAME_PREFIX}-${{ matrix.service }}"
          echo "${NAME_PREFIX}-${{ matrix.service }} estable con la nueva imagen (${GITHUB_SHA})"
