name: Deploy web-admin dev

on:
  push:
    branches: [develop]
    paths:
      - 'apps/web-admin/**'
      - 'packages/shared-types/**'
      - 'packages/tsconfig/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  workflow_dispatch:

concurrency:
  group: deploy-web-admin-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    name: Detect web-admin changes
    runs-on: ubuntu-latest
    outputs:
      web_admin: ${{ steps.filter.outputs.web-admin }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters/web-admin.yml

  deploy:
    needs: changes
    if:
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web_admin == 'true'
    uses: ./.github/workflows/deploy-web-admin.yml
    with:
      environment: dev
    secrets: inherit
