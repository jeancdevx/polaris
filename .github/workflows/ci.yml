name: CI

on:
  pull_request:
    branches: [develop, production]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  TURBO_CACHE_DIR: .turbo
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint · Format · Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Format check (prettier)
        run: pnpm format:check

      - name: Typecheck (turbo)
        run: pnpm typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Test (turbo)
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build (turbo)
        run: pnpm build

  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.services.outputs.list }}
      iac: ${{ steps.filter-iac.outputs.iac }}
    steps:
      - uses: actions/checkout@v7

      - name: Filter service paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/filters/services.yml

      - name: Filter IaC paths
        id: filter-iac
        uses: dorny/paths-filter@v4
        with:
          filters: |
            iac:
              - 'iac/**'

      - name: Build service matrix
        id: services
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          list=$(echo "$CHANGES" | jq -c '[.[] | select(. == ("api-service", "reservation-service", "event-processor-service", "admin-service"))]')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Changed services: $list"

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          tags: polaris-${{ matrix.service }}:pr
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  iac:
    name: Terraform fmt · validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.iac == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt
        run: terraform fmt -check -recursive iac

      - name: Terraform validate (dev)
        working-directory: iac/environments/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate
