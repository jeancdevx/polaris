name: Terraform apply (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment (dev, prod)
        required: true
        type: string
      terraform_directory:
        description: Path to the Terraform root module
        required: true
        type: string
      var_file:
        description: Var file relative to terraform_directory
        required: true
        type: string
      state_key:
        description: S3 state object key
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apply:
    name: Terraform apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      TF_IN_AUTOMATION: 'true'
      TF_DIR: ${{ inputs.terraform_directory }}
      TF_VAR_FILE: ${{ inputs.var_file }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ inputs.state_key }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build Lambda artifacts for Terraform
        run: pnpm turbo run build --filter='./lambdas/*'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.0

      - name: Validate Terraform backend configuration
        run: |
          if [ -z "${TF_STATE_BUCKET}" ]; then
            echo "::error::Missing GitHub environment variable TF_STATE_BUCKET for '${{ inputs.environment }}'."
            echo "::error::Set it to the state_bucket_name output from iac/bootstrap."
            exit 1
          fi
          if [ -z "${TF_STATE_KEY}" ]; then
            echo "::error::Missing Terraform state key."
            exit 1
          fi

      - name: Terraform format
        run: terraform fmt -check -recursive iac

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve -input=false \
            -var-file="${TF_VAR_FILE}" \
            -var="terraform_state_bucket=${TF_STATE_BUCKET}" \
            -var="aws_profile="

      - name: Terraform diagnostics on failure
        if: failure()
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform state list || true
          terraform show -no-color || true
