schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

enum ParkingSpotStatus {
  free
  occupied
  reserved
}

type ParkingSpot {
  spotId: String!
  zone: String!
  status: ParkingSpotStatus!
  userId: String
  vehiclePlate: String
  reservationId: String
  occupiedSince: Int
}

type ParkingStatus {
  totalSpots: Int!
  totalAvailable: Int!
  totalOccupied: Int!
  totalReserved: Int!
  totalVisitors: Int!
  spots: [ParkingSpot!]!
  updatedAt: AWSDateTime!
}

type OccupancyChanged {
  spotId: String!
  zone: String!
  status: ParkingSpotStatus!
  previousStatus: ParkingSpotStatus
  deviceId: String
  sensorType: String
  occurredAt: AWSDateTime!
}

input OccupancyChangedInput {
  spotId: String!
  zone: String!
  status: ParkingSpotStatus!
  previousStatus: ParkingSpotStatus
  deviceId: String
  sensorType: String
  occurredAt: AWSDateTime!
}

type Query {
  availability: ParkingStatus!
}

type Mutation {
  publishOccupancyChanged(input: OccupancyChangedInput!): OccupancyChanged @aws_iam
}

type Subscription {
  onOccupancyChanged(zone: String): OccupancyChanged
    @aws_subscribe(mutations: ["publishOccupancyChanged"])
    @aws_api_key
    @aws_cognito_user_pools
}
