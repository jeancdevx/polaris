name: Terraform drift detection

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-drift
  cancel-in-progress: false

jobs:
  plan:
    name: Drift (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            terraform_directory: iac/environments/dev
            var_file: dev.ci.tfvars
            state_key: env/dev/terraform.tfstate
          - environment: prod
            terraform_directory: iac/environments/prod
            var_file: prod.ci.tfvars
            state_key: env/prod/terraform.tfstate
    environment: ${{ matrix.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build Lambda artifacts for Terraform
        run: pnpm turbo run build --filter='./lambdas/*'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.0

      - name: Terraform init
        working-directory: ${{ matrix.terraform_directory }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ matrix.state_key }}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Detect drift
        id: plan
        working-directory: ${{ matrix.terraform_directory }}
        shell: bash
        run: |
          set +e
          terraform plan -refresh-only -detailed-exitcode -input=false -lock=false \
            -var-file="${{ matrix.var_file }}" \
            -var="terraform_state_bucket=${{ vars.TF_STATE_BUCKET }}" \
            -var="aws_profile=" \
            -no-color > drift-plan.txt 2>&1
          exit_code=$?
          set -e

          cat drift-plan.txt

          case "$exit_code" in
            0)
              echo "### ${{ matrix.environment }}: no drift" >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "### ${{ matrix.environment }}: drift detected" >> "$GITHUB_STEP_SUMMARY"
              echo "drift=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "### ${{ matrix.environment }}: plan failed" >> "$GITHUB_STEP_SUMMARY"
              exit "$exit_code"
              ;;
          esac

      - name: Report drift
        if: steps.plan.outputs.drift == 'true'
        run: |
          echo "::warning title=Terraform drift detected::Review the ${{ matrix.environment }} plan output."
          exit 1
