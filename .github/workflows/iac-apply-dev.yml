name: Terraform apply dev (manual)

on:
  workflow_dispatch:

concurrency:
  group: release-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    uses: ./.github/workflows/iac-apply.yml
    with:
      environment: dev
      terraform_directory: iac/environments/dev
      var_file: dev.ci.tfvars
      state_key: env/dev/terraform.tfstate
    secrets: inherit
